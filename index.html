<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/contri-symbol.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/contri-symbol.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Contri — the easiest way for Indian friends to split trip expenses and settle on UPI. Trip khatam. Hisab bhi khatam." />
    <title>Contri — Trip khatam. Hisab bhi khatam.</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('contri-theme')
        const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        const theme = savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : systemPrefersDark ? 'dark' : 'light'
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
